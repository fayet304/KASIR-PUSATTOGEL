<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aplikasi Kasir</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --text:#1a1d29; --muted:#6b7280;
    --primary:#2563eb; --primary-dark:#1d4ed8; --green:#16a34a; --red:#dc2626;
    --border:#e5e7eb; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);}
  .app{max-width:1100px;margin:0 auto;padding:16px;padding-bottom:90px;}
  .hidden{display:none !important;}

  /* LOGIN */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{background:var(--card);border-radius:var(--radius);padding:32px 24px;width:100%;max-width:380px;box-shadow:0 4px 20px rgba(0,0,0,.08);}
  .login-card h1{font-size:22px;margin:0 0 24px;text-align:center;}
  input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:15px;margin-bottom:12px;}
  button{cursor:pointer;border:none;border-radius:10px;font-size:15px;font-weight:600;padding:12px 16px;}
  .btn-primary{background:var(--primary);color:#fff;width:100%;}
  .btn-primary:active{background:var(--primary-dark);}
  .link-reset{display:block;text-align:center;margin-top:14px;color:var(--primary);font-size:14px;text-decoration:none;}
  .error-msg{color:var(--red);font-size:13px;margin:-4px 0 10px;}

  /* NAV */
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 4px 18px;}
  .topbar h2{margin:0;font-size:18px;}
  .logout-btn{background:none;color:var(--red);font-weight:600;font-size:14px;padding:6px 10px;}
  .tabbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 0;z-index:50;}
  .tabbar button{background:none;color:var(--muted);font-size:12px;flex:1;padding:8px 4px;font-weight:500;}
  .tabbar button.active{color:var(--primary);}

  /* DASHBOARD */
  .grid-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.05);}
  .card .label{color:var(--muted);font-size:12px;margin-bottom:6px;}
  .card .value{font-size:20px;font-weight:700;}
  .card.wide{grid-column:1/-1;}
  .staff-chip{display:inline-block;background:#dcfce7;color:var(--green);font-size:12px;padding:4px 10px;border-radius:20px;margin:3px 4px 0 0;}
  .breakdown-row{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px solid var(--border);}
  .breakdown-row:last-child{border-bottom:none;}

  /* TRANSAKSI */
  .bank-card-besar{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-radius:var(--radius);padding:24px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;}
  .bank-card-besar .bj{font-size:22px;font-weight:800;}
  .bank-card-besar .bn{font-size:14px;opacity:.85;margin-top:2px;}
  .bank-card-besar .bs-label{font-size:12px;opacity:.75;margin-top:16px;}
  .bank-card-besar .bs{font-size:26px;font-weight:800;}
  .bank-kode-box{background:rgba(255,255,255,.15);border-radius:12px;padding:14px 18px;min-width:170px;}
  .bank-kode-box .kk-label{font-size:11px;opacity:.75;text-transform:uppercase;letter-spacing:.5px;}
  .bank-kode-box .kk-val{font-size:16px;font-weight:700;margin-bottom:10px;word-break:break-all;}
  .bank-kode-box .kk-val:last-child{margin-bottom:0;}

  .jenis-toggle{display:flex;gap:8px;margin-bottom:16px;}
  .jenis-toggle button{flex:1;background:#fff;border:2px solid var(--border);color:var(--text);}
  .jenis-toggle button.active{border-color:var(--primary);background:var(--primary);color:#fff;}

  .bank-pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .bank-pill{background:#fff;border:2px solid var(--border);padding:8px 16px;border-radius:20px;font-weight:600;font-size:13px;}
  .bank-pill.active{border-color:var(--primary);background:var(--primary);color:#fff;}

  .form-card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.05);}
  .form-card label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px;}
  select{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:15px;margin-bottom:12px;background:#fff;}
  .kas-menu{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
  .kas-menu button{background:#fff;border:2px solid var(--border);text-align:left;padding:14px;color:var(--text);}
  .kas-menu button.active{border-color:var(--primary);background:#eff6ff;}
  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;z-index:100;}

  .histori-wrap{margin-top:16px;}
  .histori-title{font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:600;}
  .histori-row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:10px;padding:10px 14px;margin-bottom:8px;}
  .h-nama{font-size:14px;font-weight:600;}
  .h-time{font-size:12px;color:var(--muted);margin-top:2px;}
  .h-nominal{font-size:14px;font-weight:700;}
  .h-status{font-size:11px;padding:2px 8px;border-radius:10px;margin-top:4px;display:inline-block;}
  .h-status.Proses{background:#dcfce7;color:var(--green);}
  .h-status.Pending{background:#fef3c7;color:#b45309;}
  .badge{background:var(--red);color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;margin-left:4px;}
  .btn-mini{background:var(--primary);color:#fff;padding:6px 12px;font-size:12px;border-radius:8px;margin-top:6px;}

  @media(min-width:700px){
    .grid-cards{grid-template-columns:1fr 1fr 1fr;}
    .tabbar{position:static;border:none;justify-content:flex-start;gap:20px;background:none;padding:0 0 20px;}
    .tabbar button{flex:none;font-size:14px;}
    .app{padding-bottom:24px;}
  }
</style>
</head>
<body>

<!-- ================= LOGIN VIEW ================= -->
<div id="view-login" class="login-wrap">
  <div class="login-card">
    <h1>🔐 Login Kasir</h1>
    <div id="login-error" class="error-msg hidden"></div>
    <label>User ID</label>
    <input id="input-userid" type="text" placeholder="User ID">
    <label>Sandi</label>
    <input id="input-password" type="password" placeholder="Sandi">
    <button class="btn-primary" onclick="doLogin()">Masuk</button>
    <a href="#" class="link-reset" onclick="resetSandi(event)">Lupa sandi? Hubungi CS</a>
  </div>
</div>

<!-- ================= MAIN APP ================= -->
<div id="view-app" class="app hidden">
  <div class="topbar">
    <h2>💳 Kasir</h2>
    <button class="logout-btn" onclick="logout()" title="Keluar">🚪</button>
  </div>

  <div class="tabbar">
    <button id="tab-dashboard" class="active" onclick="switchTab('dashboard')">📊 Dashboard</button>
    <button id="tab-transaksi" onclick="switchTab('transaksi')">💳 Transaksi</button>
    <button id="tab-pending" onclick="switchTab('pending')">⏳ Pending <span id="pending-badge" class="badge hidden">0</span></button>
  </div>

  <!-- DASHBOARD -->
  <div id="panel-dashboard">
    <div class="grid-cards">
      <div class="card wide">
        <div class="label">Staff Kasir Online</div>
        <div id="staff-online-list">Memuat...</div>
      </div>
      <div class="card">
        <div class="label">Saldo Masuk (Depo)</div>
        <div class="value" id="total-masuk">Rp 0</div>
      </div>
      <div class="card">
        <div class="label">Saldo Keluar (WD)</div>
        <div class="value" id="total-keluar">Rp 0</div>
      </div>
      <div class="card wide">
        <div class="label">Total Saldo Kas → Bank (Proses WD)</div>
        <div id="kas-ke-bank-list"></div>
      </div>
      <div class="card wide">
        <div class="label">Total Setor Saldo Bank Depo → Kas</div>
        <div class="value" id="total-setor">Rp 0</div>
      </div>
    </div>
  </div>

  <!-- TRANSAKSI -->
  <div id="panel-transaksi" class="hidden">
    <div id="bank-card-besar" class="bank-card-besar hidden"></div>

    <div class="jenis-toggle">
      <button id="jenis-depo" onclick="pilihJenis('Depo')">Depo</button>
      <button id="jenis-wd" onclick="pilihJenis('WD')">WD</button>
      <button id="jenis-kas" onclick="pilihJenis('Kas')">Kas</button>
    </div>

    <!-- DEPO / WD FORM -->
    <div id="form-bank-wrap" class="hidden">
      <div class="bank-pill-row" id="bank-pill-row"></div>
      <div class="form-card">
        <form id="form-depo-wd" onsubmit="submitDepoWd(event)">
          <label>ID</label>
          <input id="dw-userid" required>
          <label>Nama Pengirim/Penerima</label>
          <input id="dw-nama-pihak" required>
          <label>Nominal</label>
          <input id="dw-nominal" type="number" required>
          <label>Admin</label>
          <input id="dw-admin-fee" type="number" value="0">
          <div id="dw-status-wrap">
            <label>Status</label>
            <select id="dw-status">
              <option value="Proses">Proses</option>
              <option value="Pending">Pending</option>
            </select>
          </div>
          <button class="btn-primary" type="submit">Submit</button>
        </form>
      </div>
      <div class="histori-wrap">
        <div class="histori-title">10 Transaksi Terakhir</div>
        <div id="dw-histori-list"></div>
      </div>
    </div>

    <!-- KAS FORM -->
    <div id="form-kas-wrap" class="hidden">
      <div class="jenis-toggle" style="margin-bottom:12px">
        <button id="kas-dir-b2k" class="active" onclick="pilihArahKas('b2k')">Bank → Kas</button>
        <button id="kas-dir-k2b" onclick="pilihArahKas('k2b')">Kas → Bank</button>
      </div>
      <div class="form-card">
        <form onsubmit="submitKas(event)">
          <label id="kas-label-asal">Bank Asal</label>
          <select id="kas-asal"></select>
          <label id="kas-label-tujuan">Bank Tujuan (Kas)</label>
          <select id="kas-tujuan"></select>
          <label>Nominal</label>
          <input id="kas-nominal" type="number" required>
          <button class="btn-primary" type="submit">Submit</button>
        </form>
      </div>
    </div>
  </div>

  <!-- PENDING -->
  <div id="panel-pending" class="hidden">
    <div id="pending-list"></div>
  </div>
</div>

<script>
// =====================================================================
// GANTI URL INI dengan URL Web App hasil deploy Google Apps Script kamu
// =====================================================================
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxG8AOsRS1QtcczL3vfqImyiKTmTDGcrihz79L2MDqYsaeYxdt-0kRk-HGKz1Lm7Cal/exec';

let currentUser = null;
let rekeningData = [];
let selectedRekeningId = null;
let currentJenis = null;
let currentBank = null;
let heartbeatTimer = null;

async function callApi(action, payload={}) {
  const res = await fetch(APPS_SCRIPT_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action, payload})
  });
  return res.json();
}

function showToast(msg){
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2500);
}

function formatRp(n){
  return 'Rp ' + Number(n||0).toLocaleString('id-ID');
}

// ---------- LOGIN ----------
async function doLogin(){
  const user_id = document.getElementById('input-userid').value.trim();
  const password = document.getElementById('input-password').value;
  const errEl = document.getElementById('login-error');
  errEl.classList.add('hidden');
  if(!user_id || !password){ errEl.textContent='Isi User ID dan sandi'; errEl.classList.remove('hidden'); return; }

  const res = await callApi('login', {user_id, password});
  if(!res.success){ errEl.textContent = res.message || 'Login gagal'; errEl.classList.remove('hidden'); return; }

  currentUser = res;
  localStorage.setItem('kasir_user', JSON.stringify(res));
  enterApp();
}

function resetSandi(e){
  e.preventDefault();
  window.open('https://line.me/ti/p/GANTI_DENGAN_ID_LINE_CS', '_blank');
}

function logout(){
  clearInterval(heartbeatTimer);
  localStorage.removeItem('kasir_user');
  currentUser = null;
  document.getElementById('view-app').classList.add('hidden');
  document.getElementById('view-login').classList.remove('hidden');
}

function enterApp(){
  document.getElementById('view-login').classList.add('hidden');
  document.getElementById('view-app').classList.remove('hidden');
  startHeartbeat();
  loadRekening();
  loadPending();
  switchTab('dashboard');
}

function startHeartbeat(){
  callApi('heartbeat', {user_id: currentUser.user_id});
  heartbeatTimer = setInterval(()=>{
    callApi('heartbeat', {user_id: currentUser.user_id});
    loadPending();
  }, 60000);
}

// ---------- TAB SWITCH ----------
function switchTab(tab){
  document.getElementById('tab-dashboard').classList.toggle('active', tab==='dashboard');
  document.getElementById('tab-transaksi').classList.toggle('active', tab==='transaksi');
  document.getElementById('tab-pending').classList.toggle('active', tab==='pending');
  document.getElementById('panel-dashboard').classList.toggle('hidden', tab!=='dashboard');
  document.getElementById('panel-transaksi').classList.toggle('hidden', tab!=='transaksi');
  document.getElementById('panel-pending').classList.toggle('hidden', tab!=='pending');
  if(tab==='dashboard') loadDashboard();
  if(tab==='pending') loadPending();
}

// ---------- PENDING ----------
async function loadPending(){
  const res = await callApi('getPending');
  if(!res.success) return;
  renderPending(res.data);
  updateBadge(res.data.length);
}

function renderPending(list){
  const el = document.getElementById('pending-list');
  if(!list.length){ el.innerHTML = '<div class="card" style="text-align:center;color:var(--muted)">Tidak ada transaksi pending</div>'; return; }
  el.innerHTML = list.map(t=>`
    <div class="histori-row" style="align-items:center">
      <div>
        <div class="h-nama">${t.nama_bank} — ${t.nama_pihak || '-'}</div>
        <div class="h-time">${new Date(t.timestamp).toLocaleString('id-ID')} • ID: ${t.user_id}</div>
      </div>
      <div style="text-align:right">
        <div class="h-nominal">${formatRp(t.nominal)}</div>
        <button class="btn-mini" onclick="tandaiProses('${t.id}')">Tandai Proses</button>
      </div>
    </div>`).join('');
}

async function tandaiProses(id){
  const res = await callApi('updateStatus', {id, status:'Proses'});
  if(res.success){ showToast('Status diperbarui'); loadPending(); }
  else showToast(res.message || 'Gagal update');
}

function updateBadge(count){
  const badge = document.getElementById('pending-badge');
  if(count>0){ badge.textContent = count; badge.classList.remove('hidden'); }
  else badge.classList.add('hidden');
}

// ---------- DASHBOARD ----------
async function loadDashboard(){
  const res = await callApi('getDashboard');
  if(!res.success) return;
  document.getElementById('staff-online-list').innerHTML = res.staffOnline.length
    ? res.staffOnline.map(s=>`<span class="staff-chip">🟢 ${s.nama}</span>`).join('')
    : '<span style="color:var(--muted);font-size:13px">Tidak ada staff online</span>';
  document.getElementById('total-masuk').textContent = formatRp(res.totalMasuk);
  document.getElementById('total-keluar').textContent = formatRp(res.totalKeluar);
  document.getElementById('total-setor').textContent = formatRp(res.setorTotal);

  const kkb = res.kasKeBank || {};
  const keys = Object.keys(kkb);
  document.getElementById('kas-ke-bank-list').innerHTML = keys.length
    ? keys.map(k=>`<div class="breakdown-row"><span>${k}</span><b>${formatRp(kkb[k])}</b></div>`).join('')
    : '<span style="color:var(--muted);font-size:13px">Belum ada data</span>';
}

// ---------- REKENING ----------
function isTrue(v){ return v===true || v==='TRUE' || v==='true'; }

async function loadRekening(){
  const res = await callApi('getRekening');
  if(!res.success) return;
  rekeningData = res.data;
  renderKasDropdowns();
}

function pilihRekening(id){
  selectedRekeningId = id;
  renderBankPills();
  renderBankCardBesar();
  loadHistori();
}

async function loadHistori(){
  if(!selectedRekeningId || !currentJenis) return;
  const res = await callApi('getHistori', {rekening_id: selectedRekeningId, tipe: currentJenis});
  if(res.success) renderHistori(res.data);
}

function renderHistori(list){
  const el = document.getElementById('dw-histori-list');
  if(!list.length){ el.innerHTML = '<div style="color:var(--muted);font-size:13px">Belum ada transaksi</div>'; return; }
  el.innerHTML = list.map(t=>`
    <div class="histori-row">
      <div>
        <div class="h-nama">${t.nama_pihak || '-'}</div>
        <div class="h-time">${new Date(t.timestamp).toLocaleString('id-ID')}</div>
      </div>
      <div style="text-align:right">
        <div class="h-nominal">${formatRp(t.nominal)}</div>
        ${t.status ? `<div class="h-status ${t.status}">${t.status}</div>` : ''}
      </div>
    </div>`).join('');
}

function renderBankCardBesar(){
  const el = document.getElementById('bank-card-besar');
  const rek = rekeningData.find(r=>r.id===selectedRekeningId);
  if(!rek){ el.classList.add('hidden'); return; }
  el.classList.remove('hidden');

  const adaKode = rek.kode_login || rek.kode_transfer;
  el.innerHTML = `
    <div>
      <div class="bj">${rek.jenis_bank}</div>
      <div class="bn">${rek.nama_akun}</div>
      <div class="bs-label">Saldo Akhir</div>
      <div class="bs">${formatRp(rek.saldo)}</div>
    </div>
    ${adaKode ? `
    <div class="bank-kode-box">
      ${rek.kode_login ? `<div class="kk-label">Kode Akses Login</div><div class="kk-val">${rek.kode_login}</div>` : ''}
      ${rek.kode_transfer ? `<div class="kk-label">Kode Transfer</div><div class="kk-val">${rek.kode_transfer}</div>` : ''}
    </div>` : ''}
  `;
}

let arahKas = 'b2k'; // b2k = Bank ke Kas, k2b = Kas ke Bank

function pilihArahKas(arah){
  arahKas = arah;
  document.getElementById('kas-dir-b2k').classList.toggle('active', arah==='b2k');
  document.getElementById('kas-dir-k2b').classList.toggle('active', arah==='k2b');
  renderKasDropdowns();
}

function renderKasDropdowns(){
  const bankAktif = rekeningData.filter(r=>r.tipe==='Bank' && isTrue(r.aktif));
  const kasAktif = rekeningData.filter(r=>r.tipe==='Kas' && isTrue(r.aktif));
  const bankOpt = bankAktif.map(b=>`<option value="${b.id}">${b.jenis_bank} - ${b.nama_akun}</option>`).join('');
  const kasOpt = kasAktif.map(k=>`<option value="${k.id}">${k.nama_akun}</option>`).join('');

  if(arahKas==='b2k'){
    document.getElementById('kas-label-asal').textContent = 'Bank Asal';
    document.getElementById('kas-label-tujuan').textContent = 'Bank Tujuan (Kas)';
    document.getElementById('kas-asal').innerHTML = bankOpt;
    document.getElementById('kas-tujuan').innerHTML = kasOpt;
  } else {
    document.getElementById('kas-label-asal').textContent = 'Kas Asal';
    document.getElementById('kas-label-tujuan').textContent = 'Bank Tujuan';
    document.getElementById('kas-asal').innerHTML = kasOpt;
    document.getElementById('kas-tujuan').innerHTML = bankOpt;
  }
}

// ---------- JENIS: Depo / WD / Kas ----------
function pilihJenis(jenis){
  currentJenis = jenis;
  selectedRekeningId = null;
  document.getElementById('jenis-depo').classList.toggle('active', jenis==='Depo');
  document.getElementById('jenis-wd').classList.toggle('active', jenis==='WD');
  document.getElementById('jenis-kas').classList.toggle('active', jenis==='Kas');

  document.getElementById('form-bank-wrap').classList.toggle('hidden', jenis==='Kas');
  document.getElementById('form-kas-wrap').classList.toggle('hidden', jenis!=='Kas');
  document.getElementById('bank-card-besar').classList.add('hidden');
  document.getElementById('dw-status-wrap').classList.toggle('hidden', jenis!=='Depo');
  document.getElementById('dw-histori-list').innerHTML = '';

  if(jenis==='Depo' || jenis==='WD') renderBankPills();
  if(jenis==='Kas') renderKasDropdowns();
}

function renderBankPills(){
  // Depo -> hanya bank dengan bisa_deposit aktif. WD -> hanya bank dengan bisa_withdraw aktif.
  const filterKey = currentJenis==='Depo' ? 'bisa_deposit' : 'bisa_withdraw';
  const bankList = rekeningData.filter(r=>r.tipe==='Bank' && isTrue(r.aktif) && isTrue(r[filterKey]));
  document.getElementById('bank-pill-row').innerHTML = bankList.map(b=>`
    <div class="bank-pill ${b.id===selectedRekeningId?'active':''}" onclick="pilihRekening('${b.id}')">${b.jenis_bank}</div>
  `).join('');
}

// ---------- SUBMIT ----------
async function submitDepoWd(e){
  e.preventDefault();
  if(!selectedRekeningId){ showToast('Pilih bank dulu'); return; }
  const payload = {
    tipe: currentJenis,
    user_id: document.getElementById('dw-userid').value,
    nama_pihak: document.getElementById('dw-nama-pihak').value,
    nominal: document.getElementById('dw-nominal').value,
    admin_fee: document.getElementById('dw-admin-fee').value,
    status: currentJenis==='Depo' ? document.getElementById('dw-status').value : 'Proses'
  };
  if(currentJenis==='Depo') payload.rekening_tujuan = selectedRekeningId;
  if(currentJenis==='WD') payload.rekening_asal = selectedRekeningId;

  const res = await callApi('submitTransaksi', payload);
  if(res.success){
    showToast('Transaksi berhasil disimpan');
    document.getElementById('form-depo-wd').reset();
    loadRekening();
    renderBankCardBesar();
    loadHistori();
    loadPending();
  } else showToast(res.message || 'Gagal menyimpan');
}

async function submitKas(e){
  e.preventDefault();
  const payload = {
    tipe: arahKas==='b2k' ? 'SetorKas' : 'PengajuanKas',
    user_id: currentUser.user_id,
    rekening_asal: document.getElementById('kas-asal').value,
    rekening_tujuan: document.getElementById('kas-tujuan').value,
    nominal: document.getElementById('kas-nominal').value
  };
  const res = await callApi('submitTransaksi', payload);
  if(res.success){ showToast('Transaksi kas berhasil'); e.target.reset(); loadRekening(); }
  else showToast(res.message || 'Gagal menyimpan');
}

// ---------- INIT: cek sesi tersimpan ----------
window.onload = function(){
  const saved = localStorage.getItem('kasir_user');
  if(saved){ currentUser = JSON.parse(saved); enterApp(); }
};
</script>
